<style>
  /* Cores do brandbook da Compendia, §4. Nao trocar aqui: trocar la e copiar. */
  :root{
    --fundo:#F3EBDA;      /* pergaminho */
    --tinta:#1C1712;      /* grafite-tinta */
    --suave:#6E645A;      /* pedra */
    --linha:#D9CDB6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fundo:#2C0C17; --tinta:#F3EBDA; --suave:#B9A79A; --linha:#4A1626; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1.25rem;
    background:var(--fundo); color:var(--tinta);
    font:400 1rem/1.6 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:34rem}
  h1{margin:0}
  /* O nome vive na assinatura; o texto fica escondido para leitor de tela.
     Nao usar font-size:0 nem depender do alt: no modo escuro a imagem clara
     fica display:none e o h1 ficaria sem texto acessivel nenhum. */
  .oculto{position:absolute; width:1px; height:1px; overflow:hidden;
          clip-path:inset(50%); white-space:nowrap}
  .assinatura{display:block; width:min(100%, 22rem); height:auto}
  .assinatura.escura{display:none}
  @media (prefers-color-scheme: dark){
    .assinatura.clara{display:none}
    .assinatura.escura{display:block}
  }
  .regua{width:2.5rem; height:1px; background:var(--linha); margin:1.75rem 0}
  p{margin:0; color:var(--suave); font-size:1rem}
  .contato{
    margin-top:2.5rem; padding-top:1.5rem; border-top:1px solid var(--linha);
    font:400 .875rem/1.9 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .contato a{color:var(--tinta); text-decoration:none; border-bottom:1px solid var(--linha)}
  .contato a:hover{border-bottom-color:var(--suave)}
  .contato div + div{margin-top:.15rem}
</style>
</head>
<body>
  <main>
    <h1>
      <span class="oculto">Compendia — Sistemas autênticos</span>
      <img class="assinatura clara"  src="marca/assinatura.svg?v=202609030128"
           alt="" aria-hidden="true" width="412" height="117">
      <img class="assinatura escura" src="marca/assinatura-negativa.svg?v=202609030128"
           alt="" aria-hidden="true" width="412" height="117">
    </h1>
    <div class="regua"></div>
    <p>Site em construção.</p>
    <div class="contato">
      <div><a href="mailto:compendia.com.br@gmail.com">compendia.com.br@gmail.com</a></div>
      <div><a href="https://wa.me/5534984309000">+55 34 98430-9000</a></div>
    </div>
  </main>
</body>
</html>
