<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compendia</title>
<meta name="description" content="Compendia — página em construção.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  :root{
    --fundo:#fbfaf7; --tinta:#1c1a17; --suave:#6b6560; --linha:#e3ded6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{ --fundo:#141310; --tinta:#f0ece5; --suave:#9a938a; --linha:#2e2b26; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:2rem 1.25rem;
    background:var(--fundo); color:var(--tinta);
    font:400 1rem/1.6 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing:antialiased;
  }
  main{width:100%; max-width:34rem}
  h1{
    margin:0; font-size:clamp(2.1rem, 11vw, 3.4rem); font-weight:400;
    letter-spacing:.02em; line-height:1.05;
  }
  .regua{width:2.5rem; height:1px; background:var(--linha); margin:1.75rem 0}
  p{margin:0; color:var(--suave); font-size:1rem}
  .contato{
    margin-top:2.5rem; padding-top:1.5rem; border-top:1px solid var(--linha);
    font:400 .875rem/1.9 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .contato a{color:var(--tinta); text-decoration:none; border-bottom:1px solid var(--linha)}
  .contato a:hover{border-bottom-color:var(--suave)}
  .contato div + div{margin-top:.15rem}
</style>
</head>
<body>
  <main>
    <h1>Compendia</h1>
    <div class="regua"></div>
    <p>Site em construção.</p>
    <div class="contato">
      <div><a href="mailto:compendia.com.br@gmail.com">compendia.com.br@gmail.com</a></div>
      <div><a href="https://wa.me/5534984309000">+55 34 98430-9000</a></div>
    </div>
  </main>
</body>
</html>
